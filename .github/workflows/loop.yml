name: loop-orchestrator (reusable)

# Matches one GitHub event against the hub's .github/loop-orchestrator.yml and, on a match,
# fires the repo's hosted routine with that route's prompt. It never writes to GitHub.
# A repo calls this from a small caller workflow; see templates/caller.yml.

on:
  workflow_call:
    inputs:
      config_repo:
        description: >-
          The hub repo whose config to use, as owner/name. Leave empty when this repo holds its
          own config. A code repo with a separate tracker points this at the tracker.
        required: false
        type: string
        default: ""
      orchestrator_ref:
        description: Which ref of the orchestrator's scripts to run.
        required: false
        type: string
        default: main
    secrets:
      LOOP_FIRE_URL:
        description: The routine's fire URL.
        required: true
      LOOP_FIRE_TOKEN:
        description: The routine's bearer token.
        required: true
      LOOP_CONFIG_TOKEN:
        description: Only needed when config_repo is a private repo this repo's token can't read.
        required: false

env:
  # Where this workflow's scripts live. Change it if the orchestrator moves.
  ORCHESTRATOR_REPO: mattbrailsford/github-loop-orchestrator

jobs:
  # Decides what could fire. Runs for every event, side by side, and writes nothing. Events
  # that match no route stop here, so they never queue behind or cancel the events that do.
  match:
    runs-on: ubuntu-latest
    # Bot events stop here, before a runner does anything else. Edges and ticks arrive as
    # repository_dispatch and are checked by the match script instead.
    if: github.event_name == 'repository_dispatch' || github.event.sender.type != 'Bot'
    outputs:
      count: ${{ steps.match.outputs.count }}
      stale: ${{ steps.match.outputs.stale }}
    steps:
      - name: Fetch the orchestrator's scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORCHESTRATOR_REPO }}
          ref: ${{ inputs.orchestrator_ref }}
          path: orchestrator

      - name: Fetch the hub's config
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config_repo || github.repository }}
          token: ${{ secrets.LOOP_CONFIG_TOKEN || github.token }}
          path: hub
          sparse-checkout: .github/loop-orchestrator.yml
          sparse-checkout-cone-mode: false

      - name: Convert the config to JSON
        run: |
          set -euo pipefail
          if ! command -v yq >/dev/null; then
            echo "::error::yq is not on this runner. GitHub's Ubuntu images include it; a self-hosted runner needs it installed."
            exit 1
          fi
          if [ ! -f hub/.github/loop-orchestrator.yml ]; then
            echo "::error::No .github/loop-orchestrator.yml in ${{ inputs.config_repo || github.repository }}."
            exit 2
          fi
          yq -o=json '.' hub/.github/loop-orchestrator.yml > "$RUNNER_TEMP/loop-config.json"

      - name: Match the event
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          HUB: ${{ inputs.config_repo || github.repository }}
        run: |
          node orchestrator/bin/match.mjs \
            --config "$RUNNER_TEMP/loop-config.json" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --hub "$HUB"

  # Claims, reacts, fires, and catches up. One at a time per issue or PR, so two events can't
  # both find the claim free. GitHub keeps only one waiting job per group, so a third event can
  # cancel the second while it waits; the catch-up finds that event's comment later anyway.
  fire:
    needs: match
    if: needs.match.outputs.count != '0' && needs.match.outputs.count != ''
    runs-on: ubuntu-latest
    concurrency:
      group: loop-${{ github.event.client_payload.repo || github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.client_payload.number || 'repo' }}
      cancel-in-progress: false
    steps:
      - name: Fetch the orchestrator's scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORCHESTRATOR_REPO }}
          ref: ${{ inputs.orchestrator_ref }}
          path: orchestrator

      - name: Fetch the hub's config
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config_repo || github.repository }}
          token: ${{ secrets.LOOP_CONFIG_TOKEN || github.token }}
          path: hub
          sparse-checkout: .github/loop-orchestrator.yml
          sparse-checkout-cone-mode: false

      # Matching again here, rather than passing the first job's result along, keeps prompts
      # (which carry request text) out of env and outputs, which GitHub prints in public logs.
      - name: Match the event again, into a file
        env:
          GH_TOKEN: ${{ github.token }}
          HUB: ${{ inputs.config_repo || github.repository }}
        run: |
          set -euo pipefail
          yq -o=json '.' hub/.github/loop-orchestrator.yml > "$RUNNER_TEMP/loop-config.json"
          node orchestrator/bin/match.mjs \
            --config "$RUNNER_TEMP/loop-config.json" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --hub "$HUB" \
            --out "$RUNNER_TEMP/loop-candidates.json"

      # The claim label and the 👀, 🚀, and 😕 reactions are written with the workflow's own
      # token, which starts no workflow run, so none of them can set the loop off.
      - name: Claim and fire
        env:
          GH_TOKEN: ${{ github.token }}
          HUB: ${{ inputs.config_repo || github.repository }}
          LOOP_FIRE_URL: ${{ secrets.LOOP_FIRE_URL }}
          LOOP_FIRE_TOKEN: ${{ secrets.LOOP_FIRE_TOKEN }}
        run: |
          node orchestrator/bin/fire.mjs \
            --candidates "$RUNNER_TEMP/loop-candidates.json" \
            --config "$RUNNER_TEMP/loop-config.json" \
            --hub "$HUB"

  # On a tick: clears each claim a run never released, one item at a time, inside that item's own
  # queue, so it can't race a new event on the same item. Then catches up on what waited.
  sweep:
    needs: match
    if: needs.match.outputs.stale != '[]' && needs.match.outputs.stale != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        number: ${{ fromJSON(needs.match.outputs.stale) }}
    concurrency:
      group: loop-${{ github.repository }}-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      - name: Fetch the orchestrator's scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORCHESTRATOR_REPO }}
          ref: ${{ inputs.orchestrator_ref }}
          path: orchestrator

      - name: Fetch the hub's config
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config_repo || github.repository }}
          token: ${{ secrets.LOOP_CONFIG_TOKEN || github.token }}
          path: hub
          sparse-checkout: .github/loop-orchestrator.yml
          sparse-checkout-cone-mode: false

      - name: Clear the stale claim and catch up
        env:
          GH_TOKEN: ${{ github.token }}
          HUB: ${{ inputs.config_repo || github.repository }}
          LOOP_FIRE_URL: ${{ secrets.LOOP_FIRE_URL }}
          LOOP_FIRE_TOKEN: ${{ secrets.LOOP_FIRE_TOKEN }}
          NUMBER: ${{ matrix.number }}
        run: |
          set -euo pipefail
          yq -o=json '.' hub/.github/loop-orchestrator.yml > "$RUNNER_TEMP/loop-config.json"
          jq -nc --arg repo "$HUB" --argjson number "$NUMBER" \
            '[{type: "sweep-item", item: {repo: $repo, number: $number}}]' > "$RUNNER_TEMP/loop-candidates.json"
          node orchestrator/bin/fire.mjs \
            --candidates "$RUNNER_TEMP/loop-candidates.json" \
            --config "$RUNNER_TEMP/loop-config.json" \
            --hub "$HUB"
