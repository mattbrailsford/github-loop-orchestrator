# Routes for an issue triage loop. Copy to .github/loop-orchestrator.yml.
# The orchestrator only matches these strings. What the labels mean lives in the triage skills.
# Skill names have no plugin prefix, since templates/cloud-setup.sh copies skills in bare.
#
# Maintainers talk to the routine by starting a comment with 🤖. Labels are outputs only:
# the routine sets them, and no route starts from one, because the routine posts with a
# person's account and its own label changes would look like that person's.
version: 1
# Start with shadow: the loop logs what it would do and writes nothing. Switch to live once the
# workflow logs show the right routes matching. The repo variable LOOP_MODE overrides this.
mode: shadow
bots: ["claude[bot]"]
routine_login: your-login   # the account the routine posts as; yours, unless it has its own
max_hops: 5

# While a run works on an issue, this label is on it and nothing else fires there; comments
# that come in wait their turn. The routine removes it when done. A claim a run never released
# is cleared after an hour, which has to be longer than your longest run.
claim:
  label: loop/working
  stale_after_minutes: 60

# After this many runs on one issue, the next is refused and loop/limit goes on, so a person
# looks before a conversation goes round in circles. Take the label off to let it go on.
run_limit:
  runs: 10
# code_repo: owner/code-repo   # set when this tracker is separate from the code

# loop/paused on an issue keeps the loop out of it: every route below skips it. Remove the label
# to let the loop back in. Comments posted while it was on aren't picked up afterwards.
routes:
  - name: new-issue
    when: issues.opened
    if:
      lacks_label: ["state/*", "loop/paused"]
    prompt: >-
      Run /issue-triage {number} --unattended --via-tracker for {repo} (code in {code_repo}).
      If it flags a possible security report, post nothing, and call /loop-notify as private
      with the issue link and "possible security report, please check".
      If the issue ends in state/needs-investigation, hand on with `/loop-edge investigate`.

  # Everything a maintainer says to the routine: approve, pick another state, correct it, or
  # ask for a fresh look. The skill finds the answer on the issue, typos and all, and acts on
  # it. Keep this prefix the same as "Proposal answers" in the repo's CLAUDE.md.
  - name: maintainer-says
    when: issue_comment.created
    if:
      addressed_with: ["🤖", ":robot:"]
      actor: maintainer
      lacks_label: ["loop/paused"]
    prompt: >-
      Run /issue-triage {number} --unattended --via-tracker for {repo} (code in {code_repo}).
      @{actor} answered its proposal; the skill finds the answer on the issue.
      If the issue ends in state/needs-investigation, hand on with `/loop-edge investigate`.

  - name: reporter-replies
    when: issue_comment.created
    if:
      has_label: ["state/drafted", "state/needs-info"]
      lacks_label: ["loop/paused"]
      actor: author
    prompt: >-
      Run /issue-triage {number} --unattended --via-tracker for {repo} (code in {code_repo}),
      using reporter comment {comment_id} as new detail.
      If it flags a possible security report, post nothing, and call /loop-notify as private
      with the issue link and "possible security report, please check".
      If the issue ends in state/needs-investigation, hand on with `/loop-edge investigate`.

  # Investigating only reads and runs code, so it needs no second approval.
  - name: investigate
    when: edge
    # From new-issue and reporter-replies too, once needs-investigation is on Auto-apply.
    allow_from: [new-issue, maintainer-says, reporter-replies]
    if:
      lacks_label: ["loop/paused"]
    prompt: >-
      Run /investigate-bug {number} --unattended --via-tracker for {repo} (code in {code_repo}).
      If it flags a possible security report, post nothing, and call /loop-notify as private
      with the issue link and "possible security report, please check". Hop {hop}.

  # Weekday mornings, 06:00 UTC: triage and investigate what the events missed, such as issues
  # from before the loop. It isn't about one issue, so it holds no claim: it leaves claimed
  # and paused issues alone itself.
  - name: backlog
    when: schedule
    cron: "0 6 * * 1-5"
    prompt: >-
      Run /issue-backlog --unattended --via-tracker for {repo} (code in {code_repo}). Leave out
      issues labeled loop/working or loop/paused. For each possible security report, post
      nothing, and call /loop-notify as private with the issue link and "possible security
      report, please check".

  # Weekday mornings, 07:00 UTC: one reminder about proposals nobody has answered.
  - name: stale-drafts
    when: schedule
    cron: "0 7 * * 1-5"
    prompt: >-
      List the open issues in {repo} that have had state/drafted for more than 5 days.
      If there are any, send maintainers one /loop-notify with the count and links.
      Don't comment on or change the issues.

  # First of the month, 08:00 UTC: how proposals have fared, and whether to auto-apply more
  # outcomes or fewer. The skill only suggests; a person edits the Auto-apply line.
  - name: trust-report
    when: schedule
    cron: "0 8 1 * *"
    prompt: >-
      Run /issue-triage trust --unattended for {repo}. Send maintainers one /loop-notify with
      its suggestion and the numbers behind it. Don't comment on or change any issue.
